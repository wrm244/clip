name: Clip

options:
  bundleIdPrefix: com.river
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "27.0"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    SDKROOT: macosx
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES
    GCC_NO_COMMON_BLOCKS: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # 代码签名：用自签名证书（"Clip Self Signed"）代替 ad-hoc。
    #
    # 为什么必须换掉 ad-hoc：ad-hoc 签名没有稳定身份，系统给 TCC（隐私授权）记录的
    # 「指定要求」只能是 `cdhash H"…"`——也就是对整份二进制的哈希。每次重新构建 /
    # 发新版 cdhash 都会变，辅助功能授权随即失效，用户要重新授权。
    # 换成自签名证书后，指定要求变成 `identifier "com.river.Clip" and certificate
    # leaf = H"…"`，只跟 bundle id + 证书绑定，二进制怎么变都保留授权。
    #
    # 证书需在签名钥匙串中：本地导入 p12；CI 由 release.yml 从 p12 Secret 导入。
    # 没有这张证书时，可在命令行覆盖回退：CODE_SIGN_IDENTITY="-"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Clip Self Signed"
    DEVELOPMENT_TEAM: ""
    # Hardened Runtime 只加在 Release 上：它禁止 DYLD_INSERT_LIBRARIES 之类的
    # 同用户注入，而这个 App 手里有「辅助功能」权限（可以合成按键），被注入的
    # 代价不只是丢数据。Debug 保持关闭，免得干扰本地调试（断点 / 注入工具）。
    ENABLE_HARDENED_RUNTIME: NO
    # App Sandbox 必须保持关闭：Accessibility（AXIsProcessTrusted）、
    # 全局快捷键、CGEvent 合成按键、任意文件路径的剪贴板条目，这些在沙盒里
    # 都拿不到。作为补偿，数据目录按 0700/0600 收紧并排除出备份，见 ClipStorage。
    ENABLE_APP_SANDBOX: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    ONLY_ACTIVE_ARCH: YES
    COPY_PHASE_STRIP: NO
  configs:
    # 只有发布用的 Release 打开 Hardened Runtime；Debug 保持可注入，方便调试。
    Release:
      ENABLE_HARDENED_RUNTIME: YES
      # Release 里不注入 get-task-allow：它允许同用户进程用调试器 attach，
      # 等于把上面刚打开的 Hardened Runtime 又绕回去。
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

targets:
  Clip:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      # 桌面小组件扩展。嵌进 Clip.app/Contents/PlugIns。
      - target: ClipWidget
        embed: true
    settings:
      base:
        PRODUCT_NAME: Clip
        PRODUCT_BUNDLE_IDENTIFIER: com.river.Clip
        MARKETING_VERSION: "1.0.11"
        CURRENT_PROJECT_VERSION: "13"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
    info:
      path: Support/Info.plist
      properties:
        CFBundleName: Clip
        CFBundleDisplayName: Clip
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: public.app-category.utilities
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSHumanReadableCopyright: "Copyright © 2026 River. All rights reserved."
        # 应用内语言（Localization）与系统语言是两套东西，但这里列出来有两个作用：
        # 让「系统设置 → 语言与地区 → 应用」里能单独给 Clip 选语言，
        # 也让 system_profiler / 分发工具看到真实支持的语言数量。
        CFBundleLocalizations:
          - zh-Hans
          - zh-Hant
          - en
          - ja
          - ko
          - fr
          - es
          - hi
          - ar
          - bn
        CFBundleURLTypes:
          - CFBundleURLName: com.river.Clip
            CFBundleURLSchemes:
              - clip

  # 桌面小组件。
  #
  # 独立沙盒进程：直接读不了主 App 的 SwiftData 库，也用不了 App Group
  # （免签构建下该权限会被系统忽略）。改为读取主 App 导出的只读快照，
  # 只读权限由 ClipWidget.entitlements 里的 temporary-exception 提供。
  ClipWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
        excludes:
          - Info.plist
          - "*.entitlements"
      # 快照模型与主 App 共用，避免两边字段漂移。
      - path: Sources/Support/WidgetFeed.swift
    settings:
      base:
        PRODUCT_NAME: ClipWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.river.Clip.Widget
        MARKETING_VERSION: "1.0.11"
        CURRENT_PROJECT_VERSION: "13"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: Widget/ClipWidget.entitlements
        # 小组件是纯值类型 + 时间线提供者，不需要 MainActor 默认隔离；
        # 这样能直接满足 WidgetKit 里非 MainActor 的 TimelineProvider 要求。
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
    info:
      path: Widget/Info.plist
      properties:
        CFBundleName: ClipWidget
        CFBundleDisplayName: Clip
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  Clip:
    build:
      targets:
        Clip: all
    run:
      config: Debug
    archive:
      config: Release
