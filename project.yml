name: Clip

options:
  bundleIdPrefix: com.river
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "27.0"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    SDKROOT: macosx
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES
    GCC_NO_COMMON_BLOCKS: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    ONLY_ACTIVE_ARCH: YES
    COPY_PHASE_STRIP: NO

targets:
  Clip:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      # 桌面小组件扩展。嵌进 Clip.app/Contents/PlugIns。
      - target: ClipWidget
        embed: true
    settings:
      base:
        PRODUCT_NAME: Clip
        PRODUCT_BUNDLE_IDENTIFIER: com.river.Clip
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "5"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
    info:
      path: Support/Info.plist
      properties:
        CFBundleName: Clip
        CFBundleDisplayName: Clip
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: public.app-category.utilities
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSHumanReadableCopyright: "Copyright © 2026 River. All rights reserved."
        CFBundleURLTypes:
          - CFBundleURLName: com.river.Clip
            CFBundleURLSchemes:
              - clip

  # 桌面小组件。
  #
  # 独立沙盒进程：直接读不了主 App 的 SwiftData 库，也用不了 App Group
  # （免签构建下该权限会被系统忽略）。改为读取主 App 导出的只读快照，
  # 只读权限由 ClipWidget.entitlements 里的 temporary-exception 提供。
  ClipWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
        excludes:
          - Info.plist
          - "*.entitlements"
      # 快照模型与主 App 共用，避免两边字段漂移。
      - path: Sources/Support/WidgetFeed.swift
    settings:
      base:
        PRODUCT_NAME: ClipWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.river.Clip.Widget
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "5"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: Widget/ClipWidget.entitlements
        # 小组件是纯值类型 + 时间线提供者，不需要 MainActor 默认隔离；
        # 这样能直接满足 WidgetKit 里非 MainActor 的 TimelineProvider 要求。
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
    info:
      path: Widget/Info.plist
      properties:
        CFBundleName: ClipWidget
        CFBundleDisplayName: Clip
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  Clip:
    build:
      targets:
        Clip: all
    run:
      config: Debug
    archive:
      config: Release
