name: Release

# 打上版本标签（v1.0.0 / v1.2.3-beta.1 之类）时自动编译、打包 DMG、发布到 GitHub Release。
# 也支持在 Actions 页面手动触发（用于补发 / 重跑），手动触发时填版本号即可。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（含 v，例如 v1.0.0）"
        required: true
        type: string

# 创建 / 更新 Release 需要写权限；默认 token 可能只有只读，这里显式声明。
permissions:
  contents: write

jobs:
  release:
    # 需要带 Xcode 27 / macOS 27 SDK 的镜像。若官方还没提供 macos-27，
    # 可在仓库 Settings → Variables 里设 MACOS_RUNNER（如 macos-26）临时切换，
    # 再用下面的 CLIP_XCODE_VERSION 指定 27.x 工具链。
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 环境信息（排查用）
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version

      - name: 选择 Xcode 工具链
        # 默认用镜像自带的最新 Xcode；可用仓库变量 CLIP_XCODE_VERSION 固定到某个版本。
        run: |
          if [ -n "${{ vars.CLIP_XCODE_VERSION }}" ]; then
            sudo xcode-select -s "/Applications/Xcode_${{ vars.CLIP_XCODE_VERSION }}.app"
          fi
          xcodebuild -version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 导入签名证书（未配置则回退 ad-hoc）
        id: signing
        env:
          # 仓库 Settings → Secrets 里配置：
          #   P12_BASE64   = 含「证书+私钥」的 p12 的单行 base64（base64 -i Clip-Identity.p12 | tr -d '\n' | pbcopy）
          #   P12_PASSWORD = 导出 p12 时设的密码
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail

          # 没配证书 Secret 就回退 ad-hoc：能正常构建发布，但辅助功能授权每次更新会重置。
          if [ -z "${P12_BASE64:-}" ]; then
            echo "::warning::未配置 P12_BASE64，本次使用 ad-hoc 签名（辅助功能授权会在更新后失效）"
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/clip-signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"

          # openssl 解码，避免 macOS / GNU base64 参数差异；-A 要求输入是单行。
          printf '%s' "$P12_BASE64" | openssl base64 -d -A -out "$RUNNER_TEMP/cert.p12" 2>/dev/null || true
          if [ ! -s "$RUNNER_TEMP/cert.p12" ]; then
            echo "::error::P12_BASE64 解码后为空。请确认 Secret 是单行 base64：base64 -i x.p12 | tr -d '\\n' | pbcopy"
            exit 1
          fi

          # 导入前粗检 p12 结构：坏证书早报错，并给出可操作的指引。
          P12_HEX="$(xxd -p "$RUNNER_TEMP/cert.p12" | tr -d '\n')"
          if ! grep -q '2a864886f70d010c0a0102' <<<"$P12_HEX"; then
            echo "::error::p12 中不含私钥（pkcs8ShroudedKeyBag），无法用于签名。请重新导出整条身份。"
            exit 1
          fi
          # 证书可能是明文 certBag（…0a0103），也可能被 RC2 整体加密（…010c0106）；有其一即视为含证书。
          if ! grep -q '2a864886f70d010c0a0103' <<<"$P12_HEX" && ! grep -q '2a864886f70d010c0106' <<<"$P12_HEX"; then
            echo "::error::p12 只含私钥、不含证书，导入后组不出签名身份。请在「钥匙串访问」的『我的证书』里选中带私钥的 Clip Self Signed 整条身份导出（不要只选『密钥』分类下的条目）。"
            exit 1
          fi

          security import "$RUNNER_TEMP/cert.p12" \
            -f pkcs12 \
            -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # 自签名证书在 runner 上不受信任，find-identity -v 会把它过滤掉，所以不加 -v。
          # 不用 head 提前关闭管道，避免 pipefail 下上游收到 SIGPIPE 而误判失败。
          IDENTITIES="$(security find-identity -p codesigning "$KEYCHAIN" \
            | sed -n 's/^ *[0-9]*) [0-9A-F]* "\(.*\)".*/\1/p')"
          IDENTITY="${IDENTITIES%%$'\n'*}"
          if [ -z "$IDENTITY" ]; then
            echo "::group::签名调试信息"
            security find-identity -p codesigning -v "$KEYCHAIN" || true
            security dump-keychain "$KEYCHAIN" | head -40 || true
            echo "::endgroup::"
            echo "::error::p12 已导入但未找到代码签名身份，请确认导出的是包含证书与私钥的「代码签名」身份。"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "使用签名身份：$IDENTITY"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: 解析版本号
        id: version
        run: |
          # 手动触发用输入值，标签触发用标签名
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          case "$VERSION" in
            v*) ;;
            *) VERSION="v$VERSION" ;;
          esac
          NUMBER="${VERSION#v}"
          # CFBundleShortVersionString 只用纯数字前缀（v1.2.0-beta.1 → 1.2.0）
          SHORT="$(printf '%s' "$NUMBER" | sed -E 's/^([0-9]+(\.[0-9]+)*).*/\1/')"
          [ -n "$SHORT" ] || SHORT="1.0.0"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "版本：$VERSION（短版本号 $SHORT）"

      - name: 编译（Release）
        env:
          # macOS 27 已不再支持 Intel，只编 arm64（编 x86_64 会有 deprecation 警告且无意义）。
          # 真有需要可用仓库变量 CLIP_ARCHS 覆盖，例如 "arm64 x86_64"。
          CLIP_ARCHS: ${{ vars.CLIP_ARCHS || 'arm64' }}
        run: |
          set -o pipefail
          xcodebuild \
            -project Clip.xcodeproj \
            -scheme Clip \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="$CLIP_ARCHS" \
            MARKETING_VERSION="${{ steps.version.outputs.short }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_IDENTITY="${{ steps.signing.outputs.identity }}" \
            build

      - name: 打包 DMG
        run: |
          ./Scripts/make-dmg.sh \
            "build/Build/Products/Release/Clip.app" \
            dist \
            "${{ steps.version.outputs.tag }}"
          ls -lh dist

      - name: 生成 Release 说明
        run: |
          cat > dist/RELEASE_NOTES.md <<'EOF'
          ## 安装

          下载 `.dmg`，打开后把 **Clip** 拖进「应用程序」即可。

          ## 首次打开

          本构建未使用 Apple 开发者证书（自签名 / ad-hoc），系统会提示「无法验证开发者」。
          解决办法（任选其一）：

          - 在「应用程序」里 **右键 → 打开**，再点「打开」；
          - 或执行：`xattr -dr com.apple.quarantine /Applications/Clip.app`

          ## 权限

          - **自动粘贴**需要「辅助功能」权限（系统设置 → 隐私与安全性 → 辅助功能）。
            未授权时仍会正常复制到剪贴板，只是不会自动按下 ⌘V。
          - 全局快捷键、面板呼出**不需要**任何权限。
          EOF
          cat dist/RELEASE_NOTES.md

      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          # Release 已存在（重跑 / 补发）就覆盖上传 DMG，否则新建。
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/*.dmg --clobber
          else
            gh release create "$VERSION" dist/*.dmg \
              --title "$VERSION" \
              --notes-file dist/RELEASE_NOTES.md
          fi
